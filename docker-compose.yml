services:
  api:
    build: .
    container_name: meno-api
    environment:
      - RUST_LOG=info
    ports:
      - "8080:8080"
    networks:
      - meno-network
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: meno_dev
      POSTGRES_USER: meno
      POSTGRES_PASSWORD: password
    ports: [ "5432:5432" ]
    networks:
      - meno-network

  redis:
    image: redis:8-alpine
    ports: [ "6379:6379" ]
    networks:
      - meno-network

  prometheus:
    image: prom/prometheus
    volumes:
      - "./resources/prometheus:/etc/prometheus"
    ports: [ "9090:9090" ]
    networks:
      - meno-network
    depends_on:
      - api

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - meno-network

  promtail:
    image: grafana/promtail:latest
    volumes:
      # This allows Promtail to read the logs generated by the Docker engine
      - /var/run/docker.sock:/var/run/docker.sock
      - ./resources/promtail/promtail-config.yml:/etc/promtail/config.yml
    networks:
      - meno-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana
    ports: [ "3001:3000" ]
    networks:
      - meno-network
    depends_on:
      - prometheus
      - loki

networks:
  meno-network:
    driver: bridge