services:
  api:
    build:
      context: .
      args: [ ]   # no longer needed
    container_name: meno-api
    environment:
      - RUST_LOG=info
      - DATABASE_URL=postgres://meno:password@postgres:5432/meno_dev
      - FIREBASE_PROJECT_ID=inklings-meno
      - FIREBASE_SERVICE_ACCOUNT_PATH=/run/secrets/firebase-service-account
    secrets:
      - firebase-service-account
    ports:
      - "8080:8080"
    networks:
      - meno-network
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: meno_dev
      POSTGRES_USER: meno
      POSTGRES_PASSWORD: password
    ports: [ "5432:5432" ]
    networks:
      - meno-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "meno", "-d", "meno_dev" ]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:8-alpine
    ports: [ "6379:6379" ]
    networks:
      - meno-network
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  redis-insight:
    image: redis/redisinsight:latest
    container_name: meno-redis-insight
    ports:
      - "5540:5540"
    networks:
      - meno-network
    depends_on:
      - redis

  prometheus:
    image: prom/prometheus
    volumes:
      - "./resources/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml"
    ports: [ "9090:9090" ]
    networks:
      - meno-network
    depends_on:
      - api

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    networks:
      - meno-network

  promtail:
    image: grafana/promtail:latest
    container_name: meno-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./resources/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - meno-network
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    ports: [ "3001:3000" ]
    networks:
      - meno-network
    depends_on:
      - prometheus
      - loki

  minio:
    image: minio/minio:latest
    container_name: meno-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - meno-network
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 5s
      timeout: 3s
      retries: 5

  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - meno-network
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123;
        mc mb --ignore-existing local/meno-uploads;
        mc anonymous set download local/meno-uploads/avatars;
        echo 'MinIO bucket setup completed';
      "
    restart: on-failure

networks:
  meno-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

secrets:
  firebase-service-account:
    file: ./secrets/inklings-meno-firebase-adminsdk-fbsvc-32c4a66be7.json