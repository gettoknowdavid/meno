services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: meno_dev
      POSTGRES_USER: meno
      POSTGRES_PASSWORD: password
    ports: [ "5432:5432" ]

  redis:
    image: redis:8-alpine
    ports: [ "6379:6379" ]

  prometheus:
    image: prom/prometheus
    volumes: [ "./resources/prometheus:/etc/prometheus" ]
    ports: [ "9090:9090" ]

  grafana:
    image: grafana/grafana
    ports: [ "3001:3000" ]
    depends_on: [ prometheus ]