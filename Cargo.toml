[workspace]
resolver = "3"
members = ["apps/api", "crates/core"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
meno-core = { path = "crates/core" }

axum = { version = "0.8.9", features = ["macros", "multipart", "ws"] }
bytes = "1.12.1"
http-body-util = "0.1.5"

tokio = { version = "1.43.3", features = ["full"] }
tower = { version = "0.5.3", features = ["retry", "timeout", "util"] }
tower-http = {
  version = "0.7.1",
  features = [
    "compression-gzip",
    "cors",
    "limit",
    "request-id",
    "timeout",
    "trace",
  ]
}

sqlx = {
  version = "0.9.0",
  default-features = false,
  features = [
    # `ipnetwork` gives `std::net::IpAddr` its Postgres `INET` codec, which is what
    # `auth_sessions.ip` is. Without it the column is unbindable and the session's
    # device context cannot be written at all.
    "ipnetwork",
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
    "tls-rustls",
    "uuid",
  ]
}

# `default-features = false` is deliberately NOT set: fred's defaults supply the DNS
# resolver and TLS plumbing that `Config::from_url` needs, and stripping them turns a
# connection URL into a runtime failure instead of a compile error.
# `subscriber-client` is required by the WebSocket pub/sub path (Step 8).
fred = {
  version = "10.1.0",
  features = [
    "dns",
    "dynamic-pool",
    "i-pubsub",
    "i-scripts",
    "serde-json",
    "subscriber-client",
    "tokio-rustls",
  ]
}

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.24.0"
validator = { version = "0.21.0", features = ["derive"] }

anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

chrono = "0.4.45"
time = { version = "0.3.55", features = ["serde", "serde-well-known"] }

uuid = { version = "1.27.0", features = ["serde", "v4"] }

argon2 = "0.6.0"
base64 = "0.23.1"
hex = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
rand = "0.10.3"
sha2 = "0.11.0"

apalis = { version = "1.0.0-rc.10", features = ["limit", "prometheus"] }
apalis-postgres = { version = "1.0.0-rc.9", features = ["time"] }

oauth2 = { version = "5.0.0-rc.1", features = ["reqwest"] }

# `form` is required by the push adapter's OAuth2 token exchange; `json` by every
# adapter body; `gzip` because FCM and the Google token endpoint both compress;
# `query` because the Google adapter inspects an ID token via `?id_token=`.
# reqwest 0.13 renamed `rustls-tls` to `rustls`.
reqwest = {
  version = "0.13.5",
  default-features = false,
  features = [
    "form",
    "gzip",
    "json",
    "query",
    "rustls",
  ]
}

object_store = { version = "0.14.2", features = ["aws"] }

# The `services` feature brings in the Twirp HTTP client (room administration) and
# `access-token` the JWT minting. TLS via rustls rather than native-tls, matching the
# rest of the workspace — `native-tls` would add an OpenSSL build dependency.
livekit-api = { version = "0.8.1", features = ["rustls-tls-webpki-roots"] }
livekit-protocol = "0.8.0"

async-trait = "0.1.92"
axum-prometheus = "0.10.1"

config = { version = "0.15.27", default-features = false }
dashmap = "7.0.0-rc2"
dotenvy = "0.15.7"
futures-util = "0.3.34"
mockall = "0.15.0"  # dev-dependency only
once_cell = "1.21.4"
regex = "1.13.1"
strum = { version = "0.28.0", features = ["derive"] }
wiremock = "0.6.5"  # dev-dependency only

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
must_use_candidate = "warn"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "warn"
unwrap_used = "deny"

[workspace.lints.rust]
missing_docs = "warn"

[profile.dev]
debug = 1
split-debuginfo = "unpacked"

[profile.release]
opt-level = 3
strip = true
lto = "fat"
panic = "abort"
codegen-units = 1
