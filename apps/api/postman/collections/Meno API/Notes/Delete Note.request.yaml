$kind: http-request
name: Delete Note
method: DELETE
url: '{{base_url}}/notes/{{note_id}}'
order: 4000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "baseVersion": {{note_version}}
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Note is deleted", () => {
        const json = pm.response.json();
        pm.expect(json.data.deletedAt).to.be.a('string');
      });
