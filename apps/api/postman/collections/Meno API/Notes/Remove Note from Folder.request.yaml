$kind: http-request
name: Remove Note from Folder
method: DELETE
url: '{{base_url}}/notes/{{note_id}}/folders/{{folder_id}}'
order: 9000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
