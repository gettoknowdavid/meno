$kind: http-request
name: Move Notes to Folder
method: PUT
url: '{{base_url}}/notes'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "noteIds": ["{{note_id}}"],
      "folderId": "{{folder_id}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
