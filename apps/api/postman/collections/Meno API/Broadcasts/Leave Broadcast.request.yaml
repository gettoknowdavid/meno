$kind: http-request
name: Leave Broadcast
method: POST
url: '{{base_url}}/broadcasts/{{broadcast_id}}/leave'
order: 8000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: '{}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("success is true", () => pm.expect(json.data.success).to.be.true);
      pm.test("Has leftAt timestamp", () => pm.expect(json.data.leftAt).to.be.a('string'));
