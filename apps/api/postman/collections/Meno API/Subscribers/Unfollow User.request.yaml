$kind: http-request
name: Unfollow User
method: DELETE
url: '{{base_url}}/subscribers/{{user_id}}'
order: 2000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Success message", () => {
        const json = pm.response.json();
        pm.expect(json.message).to.include("Unsubscribed");
      });
