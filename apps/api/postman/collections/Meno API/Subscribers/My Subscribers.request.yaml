$kind: http-request
name: My Subscribers
method: GET
url: '{{base_url}}/subscribers/me/subscribers'
order: 3000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
queryParams:
  - key: limit
    value: '20'
    description: 'Page size, 1–100'
    disabled: true
  - key: cursor
    value: ''
    description: 'Opaque cursor from previous page'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Has items array", () => pm.expect(json.data.items).to.be.an('array'));

      if (json.data.items.length > 0) {
        const sub = json.data.items[0];
        pm.test("Has id", () => pm.expect(sub.id).to.be.a('string'));
        pm.test("Has fullName", () => pm.expect(sub.fullName).to.be.a('string'));
        pm.test("Has isFollowing", () => pm.expect(sub.isFollowing).to.be.a('boolean'));
        pm.test("subscribedAt is RFC 3339", () => pm.expect(sub.subscribedAt).to.be.a('string'));
      }
