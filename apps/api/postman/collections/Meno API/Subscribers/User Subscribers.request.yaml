$kind: http-request
name: User Subscribers
method: GET
url: '{{base_url}}/subscribers/{{user_id}}/subscribers'
order: 5000
headers:
  - key: Authorization
    value: 'Bearer {{access_token}}'
queryParams:
  - key: limit
    value: '20'
    description: 'Page size, 1–100'
    disabled: true
  - key: cursor
    value: ''
    description: 'Opaque cursor from previous page'
    disabled: true
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Has items array", () => pm.expect(json.data.items).to.be.an('array'));
