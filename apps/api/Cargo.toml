[package]
name = "meno-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Meno HTTP API and background worker."

# Two binaries from one crate (Step 3.6): the web server and the job worker. Same
# image, same dependencies, different entry point — see src/main.rs and src/worker.rs.
[[bin]]
name = "meno-api"
path = "src/main.rs"

[[bin]]
name = "meno-worker"
path = "src/worker.rs"

[lib]
name = "meno_api"
path = "src/lib.rs"

# TEMPORARY: declaring only what the modules that exist *today* need (`config`,
# `infrastructure/{redis,ws,livekit,signals,telemetry}` and `types`). Step 3.6's final
# manifest adds the rest — sqlx, apalis, reqwest, storage, mail and the LiveKit
# service-client features — once `modules/`, `routes/` and `jobs/` exist to use them.
# Declaring the full set now would not compile.
[dependencies]
meno-core = { workspace = true }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
bytes = { workspace = true }
dashmap = { workspace = true }
# `config` is required by §4.6 ("replace `env::var` + `Context` chains with a typed,
# layered config ... with a single aggregated error"). It is declared in the workspace
# manifest and used by `config.rs` via the `ConfigSource` trait, which keeps the
# parsing testable without mutating the process environment.
config = { workspace = true }
dotenvy = { workspace = true }
fred = { workspace = true }
jsonwebtoken = { workspace = true }
livekit-api = { workspace = true }
livekit-protocol = { workspace = true }
oauth2 = { workspace = true }
object_store = { workspace = true }
reqwest = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
validator = { workspace = true }

serde = { workspace = true }
sqlx = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

# `wiremock` is §10's HTTP double: it serves the FCM token and `messages:send`
# endpoints on loopback so the adapter's real request path — bearer auth, JSON body,
# status classification — is exercised without a Firebase project. Without it the push
# adapter's HTTP behaviour is only reachable from `#[ignore]`d tests that need
# credentials.
[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true