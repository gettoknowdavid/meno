name: meno-dev

services:
  postgres:
    image: postgres:18
    container_name: meno-postgres
    environment:
      POSTGRES_DB: meno_db
      POSTGRES_USER: meno
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meno -d meno_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [meno]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: meno-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [meno]
    restart: unless-stopped

  storage:
    image: rustfs/rustfs
    container_name: meno-storage
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [meno]
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    container_name: meno-livekit
    # `--dev` runs the server with the development key pair
    # (`devkey` / `secret`), in-memory routing and no TLS. `--node-ip` is the
    # address clients are told to send media to: set LIVEKIT_NODE_IP to this
    # machine's LAN address when testing from a phone, otherwise 127.0.0.1 is
    # right for a desktop/emulator on the same machine.
    command: >-
      --dev --bind 0.0.0.0 --node-ip ${LIVEKIT_NODE_IP:-127.0.0.1}
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    networks: [meno]
    restart: unless-stopped

  storage-init:
    image: amazon/aws-cli:latest
    container_name: meno-storage-init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    networks: [meno]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket meno-uploads \
          || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket meno-uploads
        # Local image URLs are plain bucket URLs (STORAGE_PUBLIC_URL), so the
        # development bucket has to be readable without credentials. This is a
        # dev-only policy: production serves uploads through its CDN.
        aws --endpoint-url http://storage:9000 s3api delete-public-access-block \
          --bucket meno-uploads || true
        aws --endpoint-url http://storage:9000 s3api put-bucket-policy \
          --bucket meno-uploads \
          --policy '{"Version":"2012-10-17","Statement":[{"Sid":"PublicRead","Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::meno-uploads/*"]}]}'
        echo 'bucket meno-uploads ready'
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: meno-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [meno]
    restart: unless-stopped

  # ── observability ─────────────────────────────────────────────────────────────
  #
  # The shape is the one production has: the API sends OTLP to a collector, the
  # collector routes traces to Tempo and logs to Loki, and Prometheus scrapes the API's
  # `/metrics`. Nothing here is on the request path — with all four containers down the
  # API still serves, it just stops exporting. See `docs/tracing-guide.md`.

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: meno-otel-collector
    command: --config=/etc/otelcol-contrib/config.yml
    volumes:
      - ./otel-collector/config.yml:/etc/otelcol-contrib/config.yml:ro
    ports:
      # What the API dials (`OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4317`).
      - "4317:4317"
      - "4318:4318"
    depends_on: [tempo, loki]
    networks: [meno]
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    container_name: meno-tempo
    command: -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      # Trace search UI/API. Grafana queries it over the shared network.
      - "3200:3200"
    networks: [meno]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: meno-loki
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [meno]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: meno-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    # The API runs on the host, not in compose: this is what makes
    # `host.docker.internal` resolve on Linux as well as Docker Desktop.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [meno]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: meno-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Anonymous viewing keeps a second pair of eyes out of the login screen; remove
      # if this machine is shared.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus, loki, tempo]
    networks: [meno]
    restart: unless-stopped

networks:
  meno:
    name: meno
    driver: bridge

volumes:
  pgdata:
  storage_data:
  grafana_data:
  prom_data:
  loki_data:
  tempo_data:
