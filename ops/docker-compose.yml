name: meno-dev

services:
  postgres:
    image: postgres:18
    container_name: meno-postgres
    environment:
      POSTGRES_DB: meno_db
      POSTGRES_USER: meno
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meno -d meno_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [meno]
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: meno-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [meno]
    restart: unless-stopped

  storage:
    image: rustfs/rustfs
    container_name: meno-storage
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [meno]
    restart: unless-stopped

  storage-init:
    image: amazon/aws-cli:latest
    container_name: meno-storage-init
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    networks: [meno]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        aws --endpoint-url http://storage:9000 s3api head-bucket --bucket meno-uploads \
          || aws --endpoint-url http://storage:9000 s3api create-bucket --bucket meno-uploads
        aws --endpoint-url http://storage:9000 s3api put-public-access-block \
          --bucket meno-uploads \
          --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
        echo 'bucket meno-uploads ready'
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: meno-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "1025:1025"
      - "8025:8025"
    networks: [meno]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: meno-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    networks: [meno]
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: meno-loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./promtail/loki.yml:/etc/loki/local-config.yaml:ro
    ports:
      - "3100:3100"
    networks: [meno]
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: meno-promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
    depends_on: [loki]
    networks: [meno]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: meno-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on: [prometheus, loki]
    networks: [meno]
    restart: unless-stopped

networks:
  meno:
    name: meno
    driver: bridge

volumes:
  pgdata:
  storage_data:
  grafana_data:
  prom_data:
